<!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Concerts metal, hardcore et punk à Toulouse et Rennes">
    <meta name="theme-color" content="#101214">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%98%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
    <link rel="manifest" href="../../manifest.json">
    <title>Concerts Métal</title>
    <link type="text/css" rel="stylesheet" href="../../styles.css" media="all">
  </head>
  <body>
    <main>
      <header class="bg-dark mb-4">
        <nav class="container navbar navbar-dark">
        <div class="container-fluid">
          <a href="../../index.html"><h1 class="text-light h2 mb-0">🤘 Concerts Métal</h1></a>
        </div>
        </nav>
      </header>
      <div class="container mb-3">
        <div class="update-row mb-3">
          <div class="util-actions">
            <button type="button" class="util-btn" id="refresh-btn" title="Rafraîchir la page" aria-label="Rafraîchir la page">🔄</button>
            <button type="button" class="util-btn" id="qr-btn" title="Afficher le QR code de la page" aria-label="Afficher le QR code de la page">📱</button>
          </div>
          <div class="col">
            <strong>Dernière mise à jour</strong>: 21/08/2026 00:23:49
          </div>
        </div>
        <div class="selector-row">
    <div class="category-switch">
      <a class="category-btn" href="../../index.html">Toulouse</a><a class="category-btn is-active" href="../../rennes/index.html">Rennes</a><a class="category-btn" href="../../lorient/index.html">Lorient</a><a class="category-btn" href="../../montauban/index.html">Montauban</a>
    </div>
  </div>
        <div class="category-switch">
    <a class="category-btn" href="../../rennes/index.html">À venir</a><a class="category-btn is-active" href="../../rennes/historique/index.html">Historique</a>
  </div>
        <section class="news-section"><p class="empty-state">Aucun concert passé pour le moment.</p></section>
      </div>
      <div class="qr-overlay" id="qr-overlay" hidden>
        <div class="qr-modal">
          <button type="button" class="qr-close" id="qr-close" aria-label="Fermer">✕</button>
          <div id="qr-code"></div>
          <p class="qr-url" id="qr-url"></p>
        </div>
      </div>
    </main>
    <script src="../../qrcode.min.js"></script>
    <script>
      document.getElementById('refresh-btn').addEventListener('click', function () {
        location.reload();
      });
      (function () {
        var overlay = document.getElementById('qr-overlay');
        var rendered = false;
        document.getElementById('qr-btn').addEventListener('click', function () {
          if (!rendered) {
            var pageUrl = new URL('', location.href).href.replace(/index\.html$/, '');
            var qr = qrcode(0, 'M');
            qr.addData(pageUrl);
            qr.make();
            document.getElementById('qr-code').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 4 });
            document.getElementById('qr-url').textContent = pageUrl;
            rendered = true;
          }
          overlay.hidden = false;
        });
        document.getElementById('qr-close').addEventListener('click', function () {
          overlay.hidden = true;
        });
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) overlay.hidden = true;
        });
      })();
    </script>
  </body>
  </html>
